<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강동자바라 스텐 방범창 견적 계산기</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<main class="kd-wrap">
  <section class="kd-banner">
    <img src="images/banner-top.png" alt="강동자바라 스텐 방범창 평수견적 계산기">
  </section>
  <section class="kd-calculator" id="calculator">
    <div class="left-panel">
      <div class="field-section">
        <h3>1. 재질 선택</h3>
        <div id="materialOptions" class="radio-list"></div>
      </div>

      <div class="input-row">
        <div class="field-section">
          <h3>2. 가로 (mm)</h3>
          <input id="widthInput" type="number" placeholder="예) 1550">
        </div>
        <div class="field-section">
          <h3>3. 세로 (mm)</h3>
          <input id="heightInput" type="number" placeholder="예) 1650">
        </div>
      </div>

      <div class="field-section">
        <h3>4. 창문 개수</h3>
        <div class="qty-box">
          <button type="button" id="minusBtn">−</button>
          <input id="qtyInput" type="number" value="1" min="1">
          <button type="button" id="plusBtn">＋</button>
        </div>
      </div>

      <button type="button" id="addWindow" class="add-btn">＋ 창문 추가하기</button>
    </div>

    <div class="right-panel">
      <div class="result-box">
        <h3>계산 결과</h3>
        <div class="result-row"><span>예상금액</span><b id="currentAmount">0 원</b></div>
      </div>

      <h3 class="list-title">창문 목록</h3>
      <div class="table-wrap">
        <table id="windowTable">
          <thead>
            <tr><th>No.</th><th>재질</th><th>가로(mm)</th><th>세로(mm)</th><th>금액</th><th>삭제</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="emptyText" class="empty-text">창문을 추가해주세요.</div>
      </div>

      <div class="sum-box">
        <div class="result-row"><span>총 수량</span><b id="totalPyeong">0 개</b></div>
        <div class="result-row"><span>총 예상금액</span><b id="totalAmount">0 원</b></div>
        <div class="result-row order-qty-row"><span>주문수량<br><small>총 예상금액 기준 / 100원 단위 버림</small></span><b id="totalOrderQty">0 개</b></div>
      </div>
    </div>


    <div class="notice-box">
      <p>· 여러 창문의 견적을 한 번에 계산할 수 있습니다.</p>
      <p>· 온라인팀 견적기의 스텐 방범창 최종가격 기준으로 계산합니다.</p>
    </div>
  </section>
</main>
<script src="prices.js?v=8"></script>
<script src="script.js?v=8"></script>
</body>
</html>
